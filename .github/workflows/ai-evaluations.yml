name: AI evaluations

# Measures what the agents answer, against the models a dispatch declares — or the `vars.CHAT_PROVIDER_MODEL` the
# integration tests use where it declares none — judged by the panel `vars.JUDGE_PROVIDER_MODELS` seats: one to three
# jurors, separated by commas, every one asked about every rating, and the arbiter `vars.JUDGE_ARBITER_MODEL` names,
# asked only about a rating the jurors do not all pass. Leaving the arbiter unset grades with the jurors alone and records
# on every rating whether it would have been escalated, which is how the jurors are measured before an arbiter is paid
# for. Dispatch is the only way it starts: a run calls real providers and spends credit, so what a run costs is asked for rather than
# arriving on a timer or with a pull request.
#
# A run measures exactly one YAML block: the `evaluation` input where a dispatch fills it in, which replaces the
# `vars.AI_EVALUATION` repository variable whole and merges no key with it, otherwise that variable, otherwise none. The
# variable keeps the block a routine run measures and may be written as multi-line block YAML; the input takes the same
# language, usually as one line of flow YAML. The `sections` input, a comma-separated list, is the one exception to
# replacing whole: it sets the `Sections` key of whichever block won and leaves every other key as written. The first
# step resolves that one block, validates it, states in the run's summary where it came from, and hands it to the run as
# it validated it. `run_name_suffix` labels the run: its name becomes the UTC timestamp, a hyphen, and the suffix, which
# is what the report's run pickers show. A key the block does not name falls back as the suite's own defaults say — the main model to
# `vars.CHAT_PROVIDER_MODEL`, which the `Integration tests` workflow reaches too, and a reasoning model the agents offer
# tools to has to be declared with `Api: Responses`. Every key, its default, and a worked example in both YAML styles
# are in `docs/operations/local-development.md`, section *Agent evaluations*, rather than here. The variable and the
# input are both shown to anyone who can read the repository's settings or the run, so nothing private belongs in
# either — a header value included; the keys stay in secrets.
#
# What keeps a run cheap is the store `backend/tests/Evaluations` writes: every answer it paid for is
# cached by prompt, model, parameters, and the name, description, and schema of every tool the model
# was offered, and every verdict is kept so the report compares this run with the ones before it. The
# store travels from one run to the next as the `ai-evaluations-store` artefact — restored from the
# newest one that has not expired, uploaded again once a run's evaluation has started — so an unchanged
# prompt costs nothing however many runs follow. It travels as one gzip-compressed tar archive rather
# than as its own hundred thousand small files, which took minutes to upload and once failed doing it.
# An artefact expires after 90 days, and each run renews it; a store lost to a longer gap between runs
# costs one full run to rebuild and nothing else.
#
# A case passes when a majority of its repetitions pass, or every one for a case reading hostile or false-claim mail,
# and the run fails only when the share of repetitions that passed falls under the script's floor. The step summary
# lists that share overall and per section, the case count, and the unstable cases; what each rule is for, the floor, and
# how two runs are compared are in `docs/operations/local-development.md`, section *Agent evaluations*.
#
# A cancel stops the paid calls within seconds: the runner signals the evaluation step's shell alone,
# and `scripts/run-ai-evaluations.sh` passes the signal on to the test host and waits for it.
#
# `Sections` names the sections a run measures — `{Sections: [Discovery, SpamClassification]}`, or the `sections` input,
# each a directory under `backend/tests/Evaluations` holding scenarios — so a run that asks one agent afresh pays for that
# agent alone, and a name that is no section fails the run before the build. The store keeps what each run measured and nothing else; the
# report is rendered as if this run also held every other scenario's newest earlier result, tagged `Carried from <run>`,
# so it still opens on every section. The store keeps each scenario's newest 30 results, so a section's history does
# not depend on how often the others run.
#
# The key is computed by `Microsoft.Extensions.AI`, which does not promise it stays the same across its
# releases, so a bump of that package can re-ask every case once. Anything else a run suspects the key
# misses is answered by the `discard_cached_answers` input: it starts the run with an empty cache,
# keeps the results the report compares against, and uploads a store holding only what that run paid
# for. It is refused beside `Sections`, because the cache is not filed by section: emptying it would throw away the
# answers of every section the run does not measure.
#
# The artefact is readable by anyone who can read this repository's runs, which is why nothing in the
# store is mail anybody received and why every judge is recorded only as `judge` and its role on the panel: no judge's
# model and not the reasoning effort `vars.JUDGE_REASONING_EFFORT` declares for them reach the store, the report, or
# a failure message. The one place they appear is the evaluation step's log header, which prints every
# `env:` value it is handed and masks only the secrets.
#
# Each case is asked of each model as many times as the block's `Repetitions` declares, and once where it declares none.
# A model's answer varies between calls, so a model is held to the share of those repetitions that passed rather than to
# one answer, and the report shows that share per case and per model beside what the repetitions cost together. Each
# repetition is its own cached answer, so a repeated run over an unchanged prompt still costs nothing, while a run
# declaring a different count asks every repetition afresh rather than finishing a sample another run started.
#
# The `postgres_retrieval` input also measures retrieval as a deployment ranks it — the full-text index, pgvector, and
# the two fused — over a PostgreSQL container the job starts and the scenario seeds. It is off unless a dispatch turns it
# on, because a run that did not ask for it has no reason to start a database, and the scenario it serves skips wherever
# no server is named. It is a switch beside `discard_cached_answers` rather than a key in the block, because like that
# one it decides what the job does around the suite rather than what the suite measures.
on:
  workflow_dispatch:
    inputs:
      evaluation:
        description: 'The run as one YAML block, replacing the AI_EVALUATION variable whole, such as {Ref: main, MainModel: {Model: vendor/model, Api: Responses, ReasoningEffort: medium}, Repetitions: 2}; empty runs the variable'
        required: false
        type: string
      sections:
        description: 'The sections to measure, separated by commas, such as Descriptions, ReplyDrafts; replaces the Sections key of the block the run measures and nothing else'
        required: false
        type: string
      run_name_suffix:
        description: 'A label appended to the run''s name, such as luna-pro, so the report shows 20261107T222230Z-luna-pro; letters, digits, dot, underscore, and hyphen, up to 40'
        required: false
        type: string
      discard_cached_answers:
        description: 'Start with an empty response cache, so every model and every judge are asked again; the result history is kept'
        required: false
        type: boolean
        default: false
      postgres_retrieval:
        description: 'Also measure lexical, semantic, and hybrid retrieval over a PostgreSQL container the run starts and seeds'
        required: false
        type: boolean
        default: false

# One run at a time for the whole workflow rather than per ref, because every run restores and
# replaces the same store: two at once would each start from the same artefact, and whichever uploaded
# last would discard what the other paid for.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate the agents
    runs-on: ubuntu-latest
    # The newest store is found and downloaded through the artefacts API, which a job reaches with
    # `actions: read`. Nothing here writes to the repository.
    permissions:
      contents: read
      actions: read
    # Every model under test and the judge answer one request per scenario, each with a two-minute
    # ceiling, and a cached one costs nothing. A run's length is that times the models and the
    # repetitions a dispatch declares — two models asked once take about half an hour — so the job
    # takes the six hours a hosted runner holds one for at most, and a request's own ceiling is what
    # bounds a run that has stopped answering.
    timeout-minutes: 360
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      EVALUATION_STORE_ARCHIVE: ai-evaluations-store.tar.gz
    steps:
      # The one block the run measures is resolved here and nowhere else: the `evaluation` input, which replaces the
      # `AI_EVALUATION` variable whole, otherwise the variable, otherwise none — then the `sections` input, where filled in,
      # set as that block's `Sections` key in place of whatever spelling of it the block carried. What this step validates
      # is what it hands the run step as its `evaluation` output, so the two can never read different blocks.
      #
      # The block's `Ref` is read here, before any of the repository exists to read it with, and by the key's name alone,
      # without regard to case, as the suite reads every other key. `actions/checkout` reads a ref as a branch or a tag
      # name unless it is a full forty-character SHA, so an abbreviated SHA handed to it straight would fail to fetch. The
      # commits API resolves a branch, a tag, and a full or abbreviated SHA to the one commit it names, and the checkout is
      # then always of a full SHA. The inputs and the variable reach the shell through the environment rather than the
      # script text, so a ref cannot write shell of its own, and the block reaches the output under a delimiter drawn at
      # random, so it cannot write an output of its own either. `discard_cached_answers` beside `Sections` is refused here
      # too, before the restore below could empty the cache of every section the run does not measure.
      #
      # The run's name is set here as well — the UTC timestamp, then a hyphen and `run_name_suffix` where one is given — so
      # the summary can print it and the suffix is refused before anything is restored or paid for. It becomes a
      # directory name in the store, so it is held to characters every file system and the report take as they are.
      - name: Resolve the block, the run's name, and the commit to evaluate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVALUATION_INPUT: ${{ inputs.evaluation }}
          EVALUATION_VARIABLE: ${{ vars.AI_EVALUATION }}
          SECTIONS_INPUT: ${{ inputs.sections }}
          RUN_NAME_SUFFIX: ${{ inputs.run_name_suffix }}
          DISCARD_CACHED_ANSWERS: ${{ inputs.discard_cached_answers }}
        run: |
          set -euo pipefail

          if [ -n "$RUN_NAME_SUFFIX" ] && ! [[ "$RUN_NAME_SUFFIX" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,39}$ ]]; then
            echo "::error::run_name_suffix takes up to 40 ASCII letters, digits, '.', '_', and '-', and does not start with '.' or '-'."
            exit 1
          fi

          EXECUTION="$(date -u +%Y%m%dT%H%M%SZ)${RUN_NAME_SUFFIX:+-$RUN_NAME_SUFFIX}"
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"

          if [ -n "${EVALUATION_INPUT//[[:space:]]/}" ]; then
            EVALUATION="$EVALUATION_INPUT"
            SOURCE='the `evaluation` input, which replaces the `AI_EVALUATION` variable whole'
          elif [ -n "${EVALUATION_VARIABLE//[[:space:]]/}" ]; then
            EVALUATION="$EVALUATION_VARIABLE"
            SOURCE='the `AI_EVALUATION` repository variable'
          else
            EVALUATION=''
            SOURCE='neither the `evaluation` input nor the `AI_EVALUATION` variable'
          fi

          if [ -n "$EVALUATION" ] \
            && ! { kind=$(printf '%s' "$EVALUATION" | yq 'tag' 2> /dev/null) && [ "$kind" = '!!map' ]; }; then
            echo "::error::The evaluation block is not a YAML mapping. It came from $SOURCE."
            exit 1
          fi

          REQUESTED_SECTIONS_INPUT=$(yq -n -o=json -I=0 \
            '[strenv(SECTIONS_INPUT) | split(",") | .[] | sub("^\s+", "") | sub("\s+$", "") | select(. != "")]')
          SECTIONS_REPLACED=false

          if [ "$REQUESTED_SECTIONS_INPUT" != '[]' ]; then
            export REQUESTED_SECTIONS_INPUT
            SECTIONS_REPLACED=true
            if [ -n "$EVALUATION" ]; then
              EVALUATION=$(printf '%s' "$EVALUATION" \
                | yq 'with_entries(select(.key | test("(?i)^sections$") | not)) | .Sections = env(REQUESTED_SECTIONS_INPUT) | .Sections[] style=""')
            else
              EVALUATION=$(yq -n '.Sections = env(REQUESTED_SECTIONS_INPUT) | .Sections[] style=""')
            fi
          fi

          REQUESTED_REF=''
          REQUESTED_SECTIONS=0

          if [ -n "$EVALUATION" ]; then
            REQUESTED_REF=$(printf '%s' "$EVALUATION" | yq -r '[to_entries[] | select(.key | test("(?i)^ref$")) | .value][0] // ""')
            REQUESTED_SECTIONS=$(printf '%s' "$EVALUATION" | yq -r '[to_entries[] | select(.key | test("(?i)^sections$")) | .value][0] // [] | [.] | flatten | length')
          fi

          if [ "$DISCARD_CACHED_ANSWERS" = true ] && [ "$REQUESTED_SECTIONS" -gt 0 ]; then
            echo "::error::discard_cached_answers empties the whole response cache, which is not filed by section, so beside Sections or the sections input it would throw away the answers of every section this run does not measure. Dispatch one or the other."
            exit 1
          fi

          {
            echo "## Run \`$EXECUTION\`"
            echo
            echo '### The block this run measures'
            echo
            echo "From $SOURCE."
            if [ "$SECTIONS_REPLACED" = true ]; then
              echo 'The `sections` input replaced its `Sections` key; every other key is as written.'
            fi
            echo
            if [ -n "$EVALUATION" ]; then
              echo '````yaml'
              printf '%s\n' "$EVALUATION"
              echo '````'
            else
              echo 'No block, so every key takes its fallback.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          delimiter="EVALUATION_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "evaluation<<$delimiter"
            printf '%s\n' "$EVALUATION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$REQUESTED_REF" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! sha=$(gh api "repos/$REPOSITORY/commits/$REQUESTED_REF" --jq .sha); then
            echo "::error::The ref '$REQUESTED_REF' names no commit in $REPOSITORY."
            exit 1
          fi

          echo "Evaluating $REQUESTED_REF at $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The newest store any run of this workflow uploaded, from whichever ref it ran on: a store only
      # ever gains entries keyed by what was asked, so one from another ref costs nothing here and
      # saves whatever it already answered. None at all is the first run, not a failure. A dispatch
      # asking for fresh answers keeps the results and drops the cache, so the report still compares
      # this run with earlier ones and the store uploaded at the end holds only what this run paid for. An artefact
      # uploaded before the store travelled as one archive holds the store's own files, and is used as it is.
      - name: Restore the evaluation store
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISCARD_CACHED_ANSWERS: ${{ inputs.discard_cached_answers }}
        run: |
          set -euo pipefail

          store=artifacts/ai-evaluations/store
          mkdir -p "$store"

          artifact=$(gh api "repos/$REPOSITORY/actions/artifacts?name=ai-evaluations-store&per_page=1" \
            --jq '.artifacts[] | select(.expired == false) | .id')

          if [ -z "$artifact" ]; then
            echo "No earlier store to restore; this run starts an empty one."
            exit 0
          fi

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/store.zip"
          unzip -q "$RUNNER_TEMP/store.zip" -d "$store"

          if [ -f "$store/$EVALUATION_STORE_ARCHIVE" ]; then
            tar -xzf "$store/$EVALUATION_STORE_ARCHIVE" -C "$store"
            rm "$store/$EVALUATION_STORE_ARCHIVE"
          fi

          echo "Restored the store from artefact $artifact."

          if [ "$DISCARD_CACHED_ANSWERS" = true ]; then
            rm -rf "$store/cache"
            echo "Discarded every cached answer and verdict; the results are kept."
          fi

      # The one scenario that ranks mail through PostgreSQL needs a server, and a run that did not ask for it starts none.
      # The image is the one the Compose deployment pins, read from where that pin is written, so a moved pin moves this
      # run with it rather than leaving a second copy behind. The server lives on the runner's loopback for the length of
      # one job and holds only the synthetic corpus the scenario seeds, so its superuser takes no password.
      - name: Start the retrieval database
        id: retrieval-database
        if: inputs.postgres_retrieval
        run: |
          set -euo pipefail

          image=$(sed -nE 's/^[[:space:]]*image: \$\{MAILFATHOM_POSTGRES_IMAGE:-([^}]+)\}[[:space:]]*$/\1/p' deploy/compose/compose.yaml)

          if [ -z "$image" ]; then
            echo "::error::deploy/compose/compose.yaml names no PostgreSQL image to start."
            exit 1
          fi

          docker run --detach --name retrieval-database \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1::5432 \
            "$image" > /dev/null

          # Over TCP, because the image's entrypoint initializes the data directory on a server that listens on a socket
          # alone, and a socket check would call that one ready.
          for _ in $(seq 1 30); do
            if docker exec retrieval-database pg_isready --quiet --host 127.0.0.1 --username postgres; then
              port=$(docker port retrieval-database 5432/tcp | head -n 1 | sed -E 's/.*:([0-9]+)$/\1/')
              echo "Started $image on port $port."
              echo "connection=Host=127.0.0.1;Port=$port;Username=postgres;Database=postgres" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 2
          done

          docker logs retrieval-database
          echo "::error::PostgreSQL did not accept connections within a minute."
          exit 1

      - name: Run the evaluations
        run: bash scripts/run-ai-evaluations.sh
        env:
          MAILFATHOM_AI_EVALUATIONS: 'true'
          # The block the first step resolved and validated, never the input or the variable read a second time, and the
          # name it gave the run, which the store files this run's results under.
          MAILFATHOM_EVALUATION: ${{ steps.resolve.outputs.evaluation }}
          MAILFATHOM_AI_EVALUATIONS_EXECUTION: ${{ steps.resolve.outputs.execution }}
          # Where the block names no `MainModel`, the one the `Integration tests` workflow already reaches is measured, so
          # a repository configured for those tests can run this one as it stands.
          MAILFATHOM_CHAT_MODEL: ${{ vars.CHAT_PROVIDER_MODEL }}
          MAILFATHOM_CHAT_ADDRESS: ${{ vars.CHAT_PROVIDER_ADDRESS }}
          MAILFATHOM_CHAT_API_KEY: ${{ secrets.CHAT_PROVIDER_API_KEY }}
          # Every judge answers from the same endpoint and the same key as the models under test, so the
          # models are the whole of what makes the panel.
          MAILFATHOM_JUDGE_MODELS: ${{ vars.JUDGE_PROVIDER_MODELS }}
          # Unset grades with the jurors alone.
          MAILFATHOM_JUDGE_ARBITER_MODEL: ${{ vars.JUDGE_ARBITER_MODEL }}
          # How hard every judge reasons. Unset sends no reasoning parameter and leaves each provider's default.
          MAILFATHOM_JUDGE_REASONING_EFFORT: ${{ vars.JUDGE_REASONING_EFFORT }}
          # The embedding models answer from the endpoint and key a deployment's embedding provider is reached with,
          # which the provider-contract tests already read, rather than from the chat endpoint; where the block names no
          # `EmbeddingModels`, the model the integration tests reach is measured.
          MAILFATHOM_EMBEDDING_MODEL: ${{ vars.EMBEDDING_PROVIDER_ROUTED_MODEL || vars.EMBEDDING_PROVIDER_MODEL }}
          MAILFATHOM_EMBEDDING_ADDRESS: ${{ vars.EMBEDDING_PROVIDER_ADDRESS }}
          MAILFATHOM_EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_PROVIDER_API_KEY }}
          # The decision models answer from the endpoint and key the decision provider-contract tests read, with the same
          # fallbacks the `Integration tests` workflow gives them; where the block names no `SpamClassification`, the
          # model that workflow reaches is measured.
          MAILFATHOM_DECISION_MODEL: ${{ vars.DECISION_PROVIDER_MODEL || 'perplexity/pplx-decider-flash-v1.2' }}
          MAILFATHOM_DECISION_ADDRESS: ${{ vars.DECISION_PROVIDER_ADDRESS }}
          MAILFATHOM_DECISION_API_KEY: ${{ secrets.DECISION_PROVIDER_API_KEY || secrets.CHAT_PROVIDER_API_KEY }}
          # Empty unless the step above started a server, which is what leaves the PostgreSQL retrieval scenario skipped.
          MAILFATHOM_EVALUATION_DATABASE: ${{ steps.retrieval-database.outputs.connection }}

      # Kept whether the run passed, failed, or was cancelled, because a run still paid for every answer it received —
      # but only once its evaluation started, which the script records by writing the test host's PID. A run stopped or
      # failed before that changed nothing, so it uploads nothing and the newest earlier artefact stays the one the next
      # run restores. The runner kills the script seconds after a cancel, possibly before the host it signalled has
      # exited, so the store is packed only once that host is gone: waited for a minute, then killed, and never read
      # while it is still writing.
      - name: Pack the evaluation store
        id: pack-store
        if: always() && hashFiles('artifacts/ai-evaluations/test-host.pid') != ''
        run: |
          set -euo pipefail

          test_host=$(cat artifacts/ai-evaluations/test-host.pid)

          if [ -n "$test_host" ]; then
            for _ in $(seq 1 60); do
              kill -0 "$test_host" 2> /dev/null || break
              sleep 1
            done

            kill -KILL "$test_host" 2> /dev/null || true
          fi

          tar -czf "$RUNNER_TEMP/$EVALUATION_STORE_ARCHIVE" -C artifacts/ai-evaluations/store .

      # The archive is compressed already, so the artefact's own zip stores it as it is.
      - name: Keep the evaluation store
        if: always() && steps.pack-store.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluations-store
          path: ${{ runner.temp }}/${{ env.EVALUATION_STORE_ARCHIVE }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluations-report
          path: |
            artifacts/ai-evaluations/report.html
            artifacts/ai-evaluations/results/**/*.trx
          if-no-files-found: ignore
