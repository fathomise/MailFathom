name: Build, test, format, and migrations

# The build, the unit-test and coverage gate, `dotnet format`, the check that no model change outran its migration, and
# the run that applies the migrations to a real database, defined once. `CI` calls it for a pull request and the publishing pipeline calls it for the commit it is
# about to release, so "this passed CI" is one claim about one definition rather than two sets of steps that agree
# until somebody edits one of them.
#
# The model check is why a publication runs this at all rather than only a build: an image whose committed model
# snapshot describes a schema no migration produces would start against a database it cannot have, and a nightly is
# installable long before any tag.
#
# What is deliberately *not* here is the decision about whether to run. A pull request skips work its changed files
# cannot affect, and that decision needs the pull request the caller has and this workflow does not, so it arrives as
# the switches below rather than as a second changed-file query. A publication skips nothing on those grounds —
# it never asks what a change touched — and turns exactly one switch off for a reason of its own: formatting is a
# property of the files a change wrote, so the pull request that wrote them has already answered it, and it is the one
# verdict here that two changes merging without seeing each other cannot break. `CI` exempts a push to `main` on the
# same argument, and `ci.yml` is where it is stated at length.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to check. Empty checks out whatever the caller''s event points at, which is what a pull request wants.'
        required: false
        type: string
        default: ''
      run-build:
        description: 'Whether to build and run the unit-test and coverage gate.'
        required: false
        type: boolean
        default: true
      run-format:
        description: 'Whether to verify formatting.'
        required: false
        type: boolean
        default: true
      run-model:
        description: 'Whether to verify that every model change carries a migration.'
        required: false
        type: boolean
        default: true
      run-migrations:
        description: 'Whether to apply the schema artifact to a real PostgreSQL, empty and over the newest release''s schema.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build and unit test the service
    if: inputs.run-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No job in this repository caches `~/.nuget/packages`, and that is a measured answer rather than an omission.
      # The package directory compresses to 1.2 GB, restoring it took as long as `dotnet restore` and
      # `dotnet tool restore` take to fetch the same packages from nuget.org — about twenty seconds either way — and the
      # key moved with nearly every merge, because the lock files record project references as well as packages. What
      # the cache did buy was most of the repository's cache budget, spent on copies no other run could read.
      - name: Restore dependencies
        run: dotnet restore backend/MailFathom.slnx --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build backend/MailFathom.slnx --configuration Release --no-restore

      - name: Run unit tests and enforce code coverage
        run: dotnet msbuild .config/CodeCoverage.proj -t:Collect

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: 'artifacts/coverage/raw/**/*.trx'
          if-no-files-found: ignore

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: |
            artifacts/coverage/raw/**/*.cobertura.*.xml
            artifacts/coverage/report/**
          if-no-files-found: ignore

  # A job of its own rather than a step of the build above, which is the one place this workflow and the client's
  # deliberately differ. What decides the shape is which of the two costs more: the setup a separate job pays, or the
  # pass itself sitting on the path a pull request waits on. Here that is 25 seconds of checkout, SDK, and
  # restore against a 155-second pass, so a job of its own moves the longer of the two off the critical path.
  # `build-test-frontend.yml` runs no pass at all today, for the reason its own comment gives, and the decision above
  # is the one whichever build lands there will be weighed against.
  #
  # Runner time is not what either decision spends. This repository is public and its minutes are free, so merging this
  # job into the one above would buy nothing and would cost 155 seconds on every pull request that reaches the service.
  # What it would also cost is the verdict: a job reports its own conclusion in the check list and a step reports none,
  # so formatting would stop being something a reader can see the state of without opening a log.
  dotnet-format:
    name: dotnet format
    if: inputs.run-format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore backend/MailFathom.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format backend/MailFathom.slnx --verify-no-changes --verbosity diagnostic

  pending-model-changes:
    name: Pending model changes
    if: inputs.run-model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore backend/MailFathom.slnx --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      # `Host` rather than `Infrastructure`, because dotnet-ef loads MailFathom.Infrastructure.dll from
      # the startup project's output directory. Building Infrastructure alone leaves a stale assembly
      # there and the check reads the model the previous build produced.
      - name: Build the startup project
        run: dotnet build backend/src/Host/Host.csproj --configuration Release --no-restore

      # The one place the repository runs dotnet-ef directly. Everything else goes through the
      # AppHost's migration resource so a command sees the orchestrated connection string, and this
      # command is the exception because it opens no connection at all: it compares the EF Core model
      # against the committed model snapshot and answers from those two alone. Routing it through the
      # resource would mean starting PostgreSQL, an AppHost build, and a container pull to answer a
      # question about two files in the checkout.
      #
      # `Persistence__TextSearchConfiguration` is deliberately left unset. It is compiled into the
      # search vector's generated column, so the snapshot is a function of it, and the committed
      # snapshot is the one generated for the default. A migration generated under a different value
      # therefore fails here, which is the intended verdict rather than a false positive.
      - name: Verify every model change carries a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Host/Host.csproj
          --configuration Release
          --no-build

  # The one place a migration is applied before it merges. Nobody applies one on their own machine: `$add-migration`
  # generates it and reviews its SQL, and this job is what proves PostgreSQL accepts it. What it applies is the schema
  # artifact `scripts/build-schema-artifact.sh` produces — the file an operator runs — rather than a `dotnet ef database
  # update`, so the path proven here is the released one.
  #
  # Three applications, each answering a question of its own. An empty database is a fresh installation. The same
  # artifact a second time is the idempotency guard every operator relies on, since they apply one file whatever their
  # database already holds. A database carrying the newest release's schema, with the rows that release seeded, is the
  # upgrade an existing installation takes, and the only one of the three that runs a migration over data. The fresh and
  # the upgraded schema are then compared, because an upgrade that ends somewhere a fresh installation does not is a
  # deployment that differs from every test.
  #
  # The host is not started. Its startup gate compares the migration history against the migrations the build defines,
  # and an artifact generated from the same build carries every one of them by construction.
  apply-migrations:
    name: Apply migrations
    if: inputs.run-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The same install `Build the schema artifact` makes, version read from the pinned hosting packages.
      - name: Install the pinned Aspire CLI
        run: |
          set -euo pipefail

          aspire_version="$(
            sed -n 's:.*<PackageVersion Include="Aspire.Hosting.AppHost" Version="\([^"]*\)".*:\1:p' \
              backend/Directory.Packages.props | head -n 1
          )"

          dotnet tool install --global Aspire.Cli --version "$aspire_version"
          printf '%s\n' "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the schema artifact
        run: bash scripts/build-schema-artifact.sh "$RUNNER_TEMP/schema" head > "$RUNNER_TEMP/schema-artifact.env"

      - name: Download the newest release's schema artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'mailfathom-schema-*.sql*' --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check ./*.sha256)

      # The image the app model declares, read out of it rather than restated, so this applies to the PostgreSQL and
      # pgvector every other topology runs.
      - name: Start PostgreSQL
        run: |
          set -euo pipefail

          image="$(sed -n 's:.*\.WithImage("\([^"]*\)").*:\1:p' backend/src/AppHost/Program.cs | head -n 1)"
          tag="$(sed -n 's:.*\.WithImageTag("\([^"]*\)").*:\1:p' backend/src/AppHost/Program.cs | head -n 1)"
          [[ -n "$image" && -n "$tag" ]] || { printf 'No PostgreSQL image found in the app model.\n' >&2; exit 1; }

          docker run --detach --name postgres --env POSTGRES_PASSWORD=postgres "$image:$tag" > /dev/null

          for _ in $(seq 60); do
            docker exec postgres pg_isready --host 127.0.0.1 --username postgres > /dev/null 2>&1 && exit 0
            sleep 2
          done

          docker logs postgres >&2
          exit 1

      - name: Apply the migrations
        run: |
          set -euo pipefail

          head_artifact="$(sed -n 's/^artifact=//p' "$RUNNER_TEMP/schema-artifact.env")"
          release_artifact="$(find "$RUNNER_TEMP/release" -name 'mailfathom-schema-*.sql' -type f)"

          psql_in() {
            docker exec --interactive postgres \
              psql --username postgres --dbname "$1" --set ON_ERROR_STOP=on --quiet > /dev/null
          }

          # `\restrict` carries a random key on every dump, so it is the one line two dumps of one schema differ in.
          dump_schema() {
            docker exec postgres pg_dump --username postgres --schema-only --no-owner --no-privileges "$1" |
              grep --invert-match --extended-regexp '^\\(un)?restrict '
          }

          for database in fresh upgraded; do
            psql_in postgres <<< "CREATE DATABASE $database"
          done

          printf 'Applying %s to an empty database, twice.\n' "$(basename "$head_artifact")"
          psql_in fresh < "$head_artifact"
          psql_in fresh < "$head_artifact"

          printf 'Applying %s, then %s over it.\n' "$(basename "$release_artifact")" "$(basename "$head_artifact")"
          psql_in upgraded < "$release_artifact"
          psql_in upgraded < "$head_artifact"

          mkdir --parents artifacts/applied-schema
          dump_schema fresh > artifacts/applied-schema/schema.sql
          dump_schema upgraded > "$RUNNER_TEMP/upgraded-schema.sql"

          if ! diff --unified artifacts/applied-schema/schema.sql "$RUNNER_TEMP/upgraded-schema.sql"; then
            printf 'The upgraded schema differs from a fresh installation of the same artifact.\n' >&2
            exit 1
          fi

      # What PostgreSQL holds after the migrations, for a review to read beside `scripts/script-migration.sh`. Schema
      # only, never a row, so it carries no personal data.
      - name: Upload the applied schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: applied-schema
          path: artifacts/applied-schema/
          if-no-files-found: ignore
