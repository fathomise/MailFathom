name: Prove the apt fallback mirror serves an install

# A one-off demonstration for issue 3176, on this branch alone and never merged. Every mirror the runner lists is
# pointed at a host that does not resolve, so only the line the action appends can serve the install.
on:
  push:
    branches:
      - agent/apt-fallback-mirror-proof

permissions:
  contents: read

jobs:
  miss-with-ordinary-mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - timeout-minutes: 5
        uses: ./.github/actions/cached-apt-install
        with:
          name: proof-a-${{ github.run_id }}
          content: none
          install: |
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends webkit2gtk-driver xvfb libxdo-dev

  miss-with-fallback-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo sed -i -E 's#https?://[^/]+#http://mirror.invalid#' /etc/apt/apt-mirrors.txt
      - timeout-minutes: 8
        uses: ./.github/actions/cached-apt-install
        with:
          name: proof-b-${{ github.run_id }}
          content: none
          install: |
            ls -la /var/cache/apt-downloads /var/cache/apt-downloads/lists | head -30
            sudo timeout 150 apt-get update -o Debug::Acquire::http=true -o Debug::Acquire::https=true -o Debug::pkgAcquire::Worker=true 2>&1 | grep -v "Ign:" | tail -150 || echo "update exit $?"
            ps aux | grep -E "apt|methods" | head
            sudo apt-get install --yes --no-install-recommends webkit2gtk-driver xvfb libxdo-dev
