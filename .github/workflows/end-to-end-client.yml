name: End-to-end client

# Every night `main` moved, and whenever somebody dispatches it. It is not a pull-request check, `Nightly` does not call
# it, and `Release` does not either — so nothing in this repository is gated on it and no merge waits for it. What it
# answers is whether the whole thing still holds together, and the client is where the defects are and nobody tries it
# by hand, so the question is asked the night after a change merges rather than whenever somebody next thinks to.
#
# **A night on which `main` did not move costs one short job.** `decide` reads whether a completed scheduled run of this
# workflow already ran the commit `main` is at, whatever that run concluded: a commit that failed last night is not run
# again tonight, because its report already says why and a re-run is a dispatch away. When one did, the run ends there
# and names it. A dispatch is exempt and always runs, with or without a `ref`.
#
# What a run that does go ahead costs, on a GitHub-hosted runner: roughly fifteen to twenty minutes of runner time. Two
# container images are pulled, the client bundle and the service are both built, the schema artifact is generated
# through `aspire publish`, a mailbox is filled over SMTP one message at a time, and a real browser then drives the
# result. Nothing here calls an AI provider, so it spends no provider credit at all.
#
# **Every run that reaches the pipeline leaves a report**, passed or failed and wherever the script stopped: the
# `end-to-end-client-report` artifact carries `report.json` for a session triaging the night and `report.md` for a
# person, and the job summary is the Markdown. It names the commit, the step the pipeline stopped in, every spec with
# its outcome, each failed one with its error and the path of its trace inside `end-to-end-client-browser`, and every
# error-level entry the service logged that no spec declared it would cause — which fails the run on its own.
# `docs/operations/end-to-end-client-run.md` is the page.
on:
  # 03:00 UTC, clear of `Nightly` at midnight and of the hosted queue's busiest hour. A schedule runs on the default
  # branch, so a scheduled run is always `main`.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run against'
        required: false
        type: string

concurrency:
  # One run at a time per ref, for the reason the integration suite serializes: the app model publishes this run's two
  # servers on stated ports, so a second run on the same runner could not bind them.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides one thing: whether a scheduled run has anything to prove. It reads this workflow's own completed scheduled
  # runs on the commit `main` is at, which is the record of what a night already answered for — no state is kept beside
  # it, so a deleted run or a re-run cannot leave the answer stale.
  decide:
    name: Decide whether main moved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Look for a scheduled run that already ran this commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT" != 'schedule' ]]; then
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
            printf 'A %s runs regardless of what an earlier run answered for.\n' "$EVENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Newest first, so the last one is the run that actually drove the commit; any after it ended here.
          answered="$(
            gh api "repos/$REPOSITORY/actions/workflows/end-to-end-client.yml/runs?event=schedule&status=completed&head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs | last | select(. != null) | "\(.html_url) (\(.conclusion))"'
          )"

          if [[ -n "$answered" ]]; then
            printf 'run=false\n' >> "$GITHUB_OUTPUT"
            printf 'main has not moved: %s was already run by %s. Dispatch the workflow to run it again.\n' \
              "$HEAD_SHA" "$answered" | tee --append "$GITHUB_STEP_SUMMARY"
          else
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
            printf 'main moved to %s, which no scheduled run has driven yet.\n' "$HEAD_SHA" | tee --append "$GITHUB_STEP_SUMMARY"
          fi

  end-to-end-client:
    name: End-to-end client
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Well above what a run takes and well below the six hours a job is otherwise given. Every wait inside the pipeline
    # is bounded already, so what this bounds is the case none of them cover: a build or an image pull that never
    # finishes, holding a runner for an afternoon on a run nothing is waiting for.
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The commit `decide` judged rather than the branch it was on, which may have moved since.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Both read out of the client's manifest rather than restated here, exactly as `Build and test the client` reads
      # them: `engines.node` decides the Node version and `packageManager` decides which pnpm wrote the lock file.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json

      - name: Install pnpm
        run: npm install --global "$(jq --raw-output .packageManager frontend/package.json)"

      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restored and never saved here: `Build and test the frontend` is where `main` saves the store and the browser
      # below, and that workflow says why nothing else does.
      - name: Restore the pnpm store
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The schema artifact comes from `aspire publish`, so the run needs the CLI at the generation the app model's
      # hosting packages are pinned to. `scripts/build-schema-artifact.sh` reads that pin and says so when the CLI is
      # missing; installing it here is what keeps the script from being the thing that fails.
      - name: Install the Aspire CLI
        run: |
          pinned="$(sed -n 's:.*<PackageVersion Include="Aspire.Hosting.AppHost" Version="\([^"]*\)".*:\1:p' backend/Directory.Packages.props | head -n 1)"
          dotnet tool install --global Aspire.Cli --version "$pinned"

          # Stated rather than assumed, exactly as `Build the schema artifact` states it. A global tool lands here
          # whatever the runner image happens to put on PATH, and the pipeline below refuses to run without `aspire`.
          printf '%s\n' "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Ahead of the browser install, which runs out of the workspace's own `node_modules`. The pipeline restores the
      # workspace again as its first step and finds nothing left to do.
      - name: Restore the client workspace
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir frontend exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser the end-to-end configuration names, and only that one.
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install chromium

      # The system libraries the browser needs, which a runner lacks and a developer machine usually does not, from the
      # same cached downloads as the browser suite's, after a mirror is chosen and under the bounds `Build the desktop
      # client` gives both steps.
      - name: Choose a fast apt mirror
        timeout-minutes: 2
        uses: vegardit/fast-apt-mirror.sh@1.4.5

      - name: Install Chromium's system libraries
        timeout-minutes: 5
        uses: ./.github/actions/cached-apt-install
        with:
          name: playwright
          content: ${{ steps.playwright.outputs.version }}
          install: pnpm --dir frontend exec playwright install-deps chromium

      # The same script a person runs, so this pipeline has one way to be started rather than two that can drift. It
      # builds the bundle and the schema, starts the app model's two servers, applies the artifact, publishes and starts
      # MailFathom, provisions the credential, replays the corpus, waits for the account to synchronize, and then drives
      # the client. A failure names the step it happened in.
      - name: Run the end-to-end client pipeline
        id: pipeline
        run: bash scripts/run-end-to-end-client.sh

      # The report the script wrote on its way out, whatever it concluded. A run that reached the pipeline and left no
      # report is a defect in the script rather than a quiet night, so a missing file fails the upload.
      - name: Upload the report
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-client-report
          path: |
            artifacts/end-to-end-client-report/report.json
            artifacts/end-to-end-client-report/report.md
          if-no-files-found: error

      - name: Write the report to the job summary
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        run: |
          if [[ -f artifacts/end-to-end-client-report/report.md ]]; then
            cat artifacts/end-to-end-client-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept, unlike the pull-request browser suite's, and for the reason that suite's configuration records: every
      # message in this run is fabricated and its mailbox is destroyed with the run, so a trace carries no personal data
      # and a screenshot shows nobody's mail. They are the whole diagnosis of a failure that cannot be reproduced by
      # reading a log.
      - name: Upload the browser trace and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-client-browser
          path: 'frontend/.playwright-end-to-end/**'
          # The directory's name begins with a dot, and this action passes over a hidden path unless it is told not to.
          # Without this the upload succeeded and carried nothing, which `if-no-files-found: ignore` then said nothing
          # about — a failed run whose whole diagnosis was an artifact that was never there.
          include-hidden-files: true
          if-no-files-found: ignore

      # What each step of standing the deployment up printed, which is where a failure before the browser is read.
      - name: Upload the service and orchestration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-client-logs
          path: 'artifacts/end-to-end-client/**'
          if-no-files-found: ignore
