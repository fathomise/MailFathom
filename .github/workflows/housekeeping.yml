name: Housekeeping

# Routine upkeep of the repository's own tracker, on a schedule rather than on an event. It is named for the kind of
# work rather than for its first job, because further upkeep of the same shape belongs here as another job beside it.
#
# Once a night, because nothing it does is urgent: at 04:17 Warsaw time, clear of the hour a change of clock skips or
# repeats, and seventeen minutes past the hour because GitHub delays the schedules that land on it. A manual dispatch
# runs it at once and can be told to change nothing.
on:
  schedule:
    - cron: '17 4 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Name what would change and change nothing'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A parent closes when its sub-issues do; `docs/operations/issue-tracking.md` says so, and the script carries how.
  close-completed-parents:
    name: Close completed parents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Close completed parents
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == 'true' ]]; then
            bash scripts/close-completed-parents.sh "$GITHUB_REPOSITORY" --dry-run
          else
            bash scripts/close-completed-parents.sh "$GITHUB_REPOSITORY"
          fi
