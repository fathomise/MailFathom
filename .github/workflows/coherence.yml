name: Coherence

# Stops a pull request when a change related to it landed underneath it, and names exactly what to
# read.
#
# Git merges two changes without a conflict whenever they touch different lines, and a test proves
# the combined tree builds and behaves. Neither sees a page one pull request adds that describes a file
# another one changed. This check covers that half: it compares what landed since the pull request's
# merge base with what the pull request changes, and fails on every pair
# `.github/coherence/relate-changes.sh` relates through prose. An unrelated merge costs the pull
# request nothing, which is what a branch-must-be-current rule cannot offer. Every `AGENTS.md`, the
# two operations pages, and the licence register are left out of both sides; the step below says
# why. A pair in which one side's code names the other side's file is a warning and fails nothing,
# until what it reports shows whether it should.
#
# It runs on `merge_group` as well, where what landed is everything between the merge base and what
# the queue entry merges onto — `main` plus the pull requests ahead of it — so the pair a queue would combine
# without anybody reading is caught before it reaches `main`.
#
# It is a workflow of its own rather than a job of `CI` so that it reports within seconds instead of
# after the build, and so that its red means one thing.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coherence:
    # No draft guard: it costs seconds, and a related change is worth knowing about while the pull
    # request is still being written.
    name: Coherence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The whole history, because the merge base can be any distance back, but without blobs: most
      # questions below are about which paths a commit touched, which trees answer, and the added
      # lines the naming relation reads are fetched on demand. The checkout is the combined tree — the
      # pull request's merge commit, or the merge group's head — and that is the tree the `describes:`
      # markers and the `AGENTS.md` files are read from.
      - name: Check out the combined tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Relate what landed to what this pull request changes
        id: relate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_BRANCH: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.ref }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          work_directory="$(mktemp -d)"

          # The combined tree's first parent is what this pull request would merge onto: current
          # `main` for a pull request, and `main` plus the entries ahead of it for a merge group.
          merge_onto="$(git rev-parse HEAD^1)"

          # A pull request's merge commit carries its head as the second parent. A merge group's head
          # is a squash and carries none, so the head is fetched from the pull request's own ref,
          # whose number is the one GitHub writes into the queue branch's name.
          if [[ "$EVENT_NAME" == 'merge_group' ]]; then
            pull_request_number="$(sed -nE 's|^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$MERGE_GROUP_HEAD_REF")"
            if [[ -z "$pull_request_number" ]]; then
              echo "::error::The merge group ref ${MERGE_GROUP_HEAD_REF} names no pull request."
              exit 1
            fi
            git fetch --quiet --no-tags --filter=blob:none origin "refs/pull/${pull_request_number}/head"
            pull_request_head="$(git rev-parse FETCH_HEAD)"
          else
            pull_request_head="$(git rev-parse HEAD^2)"
          fi

          merge_base="$(git merge-base "$merge_onto" "$pull_request_head")"

          # Every `AGENTS.md` and the two operations pages relate to nearly every change — through the
          # directory an `AGENTS.md` governs, the `describes:` markers those pages carry, and how
          # often both sides edit them — so a pair through one of them stopped almost any two pull
          # requests open together. The licence register is edited by every dependency change, one
          # independent row each, so two of them never disagree and a conflict on one row is git's to
          # report. They stay out of both sides here, and only here:
          # `scripts/report-related-pull-requests.sh` still relates them before publication.
          hub_documents='(^|/)AGENTS\.md$|^docs/operations/(agent-workflow|local-development)\.md$|^THIRD_PARTY_LICENSES\.md$'

          # `--no-renames` keeps both ends of a move, and keeps git from fetching blobs to detect one.
          git diff --name-only --no-renames "$merge_base" "$merge_onto" \
            | { grep -vE "$hub_documents" || true; } > "$work_directory/landed"
          git diff --name-only --no-renames "$merge_base" "$pull_request_head" \
            | { grep -vE "$hub_documents" || true; } > "$work_directory/changed"

          # The added lines are what a code file names another by. These are the only reads of
          # content, and git fetches the blobs they need in one batch.
          git diff --no-ext-diff --no-renames --no-color --unified=0 "$merge_base" "$merge_onto" > "$work_directory/landed.diff"
          git diff --no-ext-diff --no-renames --no-color --unified=0 "$merge_base" "$pull_request_head" > "$work_directory/changed.diff"

          bash .github/coherence/relate-changes.sh \
            "$GITHUB_WORKSPACE" "$work_directory/landed" "$work_directory/changed" \
            "$work_directory/landed.diff" "$work_directory/changed.diff" "$work_directory/pairs.json"

          pair_count="$(jq 'length' "$work_directory/pairs.json")"
          failing_count="$(jq '[.[] | select(.reason | test(" names ") | not)] | length' "$work_directory/pairs.json")"
          landed_count="$(grep -c . "$work_directory/landed" || true)"

          if (( pair_count == 0 )); then
            echo "Nothing related to this pull request landed since its merge base ${merge_base:0:12} (${landed_count} paths landed)."
            exit 0
          fi

          # Where each landed path came from: the commits between the merge base and what this would
          # merge onto that touched it. A squash merge names its pull request at the end of its
          # subject, which is what a reader opens; a commit that names none is given by its hash.
          introduced_by() {
            local path="$1" commit subject number place

            while IFS=' ' read -r commit subject; do
              number="$(sed -nE 's/.*\(#([0-9]+)\)$/\1/p' <<< "$subject")"
              if [[ -n "$number" ]]; then
                place="${REPOSITORY_URL}/pull/${number}"
              else
                place="${commit:0:12} ${subject}"
              fi

              # Everything a pull request sees landed is on `main` by construction. On a merge group,
              # not `merge_group.base_sha`: that is the group's parent commit, the first parent above,
              # which already carries the entries ahead. The base branch's tip is what is on `main`,
              # and the full-history checkout holds it as a remote-tracking ref.
              if [[ "$EVENT_NAME" != 'merge_group' ]] \
                || git merge-base --is-ancestor "$commit" "origin/${BASE_BRANCH#refs/heads/}"; then
                place+=' (on main)'
              else
                place+=' (ahead in the queue)'
              fi

              printf '%s; ' "$place"
            done < <(git log --format='%H %s' "${merge_base}..${merge_onto}" -- "$path")
          }

          {
            echo '### Other pull requests changed files related to this one'
            echo
            echo "Each row pairs a file this pull request changes with a file another pull request changed after this branch's merge base \`${merge_base:0:12}\`. Read the two together, reconcile whichever one no longer agrees, and rebase onto \`main\` once the other pull request is on it. A row in which one file names the other is a warning and does not fail the check."
            echo
            echo '| Changed by this pull request | Changed by another pull request | Which pull request | How they relate |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r landed changed reason; do
            source_of_landed="$(introduced_by "$landed")"
            source_of_landed="${source_of_landed%; }"

            severity='error'
            title='Related change in another pull request'
            case "$reason" in
              'same prose file')
                relation='both changed this prose file'
                message="${changed} is changed by this pull request and was also changed by ${source_of_landed}."
                ;;
              'landed describes changed')
                relation="the other pull request's page has a \`describes:\` marker covering the file here"
                message="${landed}, changed by ${source_of_landed}, has a describes: marker covering ${changed}, which this pull request changes."
                ;;
              'changed describes landed')
                relation="the page here has a \`describes:\` marker covering the other pull request's file"
                message="${changed}, which this pull request changes, has a describes: marker covering ${landed}, changed by ${source_of_landed}."
                ;;
              'landed governs changed')
                relation="the other pull request's \`AGENTS.md\` governs the file here"
                message="${landed}, changed by ${source_of_landed}, governs ${changed}, which this pull request changes."
                ;;
              'changed governs landed')
                relation="the \`AGENTS.md\` here governs the other pull request's file"
                message="${changed}, which this pull request changes, governs ${landed}, changed by ${source_of_landed}."
                ;;
              'landed names changed')
                severity='warning'
                title='File named across pull requests'
                relation="the other pull request's code names the file here"
                message="${landed}, changed by ${source_of_landed}, names ${changed}, which this pull request changes."
                ;;
              'changed names landed')
                severity='warning'
                title='File named across pull requests'
                relation="the code here names the other pull request's file"
                message="${changed}, which this pull request changes, names ${landed}, changed by ${source_of_landed}."
                ;;
              *)
                echo "::error::relate-changes.sh returned the unknown relation '${reason}'."
                exit 1
                ;;
            esac

            echo "::${severity} title=${title}::${message} Read the two together."
            echo "| \`${changed}\` | \`${landed}\` | ${source_of_landed} | ${relation} |" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.landed, .changed, .reason] | @tsv' "$work_directory/pairs.json")

          echo "${pair_count} file(s) changed by other pull requests relate to files this pull request changes, ${failing_count} of them through prose; the job summary lists them."
          if (( failing_count > 0 )); then
            exit 1
          fi
